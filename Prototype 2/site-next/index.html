      (function() {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';

          var saved = localStorage.getItem('sirosiu-theme');
          var isLight = saved ? (saved === 'light') : window.matchMedia('(prefers-color-scheme: light)').matches;
