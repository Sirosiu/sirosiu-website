<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ankush Malothia (Sirosiu) — Applied AI systems, computer architecture, and hardware acceleration."
    />
    <meta name="theme-color" content="#090909" />
    <title>Ankush Malothia — Applied AI & Architecture</title>
    <script>
      (function() {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          var saved = localStorage.getItem('sirosiu-theme');
          var isLight = saved ? (saved === 'light') : window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
